spring.application.name=api-gateway
server.port=8083

# Logging Pattern and Tracing
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
management.endpoints.web.exposure.include=health,info,prometheus,metrics

# Force the gateway routing logic and HTTP loops to talk
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.web.server.adapter.HttpWebHandlerAdapter=TRACE

# Enable low-level reactive server wire-logging (great for debugging traces)
logging.level.reactor.netty.http.server=DEBUG
